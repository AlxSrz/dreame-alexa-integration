# Reverse proxy de Home Assistant con HTTPS (Let's Encrypt)
# Copiar a /etc/nginx/sites-available/homeassistant en el VPS y enlazar:
#   sudo ln -s /etc/nginx/sites-available/homeassistant /etc/nginx/sites-enabled/
# Luego correr certbot para emitir el certificado (ver README.md paso 2).

server {
    listen 80;
    server_name ha.TUDOMINIO.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ha.TUDOMINIO.com;

    # Certbot rellenará estas dos líneas automáticamente:
    # ssl_certificate /etc/letsencrypt/live/ha.TUDOMINIO.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ha.TUDOMINIO.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
