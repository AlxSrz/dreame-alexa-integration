services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    # Sin `privileged`/`network_mode: host`: no hace falta descubrimiento de
    # red local (mDNS/SSDP) porque el robot se controla vía la nube de
    # Dreamehome, no en la LAN del VPS. Este droplet también corre alce-fiscal
    # con datos fiscales de clientes, así que conviene el menor privilegio
    # posible y no exponer 8123 fuera de localhost (nginx hace el proxy).
    ports:
      - "127.0.0.1:8123:8123"
    # El droplet (1.9 GiB) ya corre alce-fiscal + postgres + scraper + n8n +
    # elegance-reels con RAM ajustada (ver CONTEXTO.md). Este límite acota a
    # HA para que no arrastre al resto a swap pesado.
    #
    # Historial de medidas en producción (27 sept 2026), contenedor real:
    #   - 350m: insuficiente. HA pelado (sin HACS) ya usa ~338MiB.
    #   - 512m: insuficiente con HACS + `dreame_vacuum`. El kernel mató el
    #     proceso 12 veces dentro del cgroup ("Memory cgroup out of memory:
    #     Killed process python3 ... anon-rss:517340kB"), en bucle de
    #     reinicio cada ~30s al llegar al techo durante el arranque. En
    #     reposo quedaba en 464MiB/512MiB (90%) — cualquier consulta de la
    #     integración o abrir la UI lo volvía a matar.
    #   - 768m: elegido. Deja ~250MiB de colchón sobre el consumo en reposo
    #     observado (464MiB) para mapas/cámara/polling de dreame_vacuum.
    #
    # `memswap_limit` se deja por ENCIMA del de RAM (256m de swap propio) a
    # propósito: con memswap_limit == mem_limit el contenedor no puede usar
    # swap en absoluto, así que cualquier pico transitorio es muerte
    # instantánea; con este margen, un pico se va a swap (más lento pero
    # vivo) y el peor caso queda acotado en 1 GiB, sin poder desangrar al
    # resto del host. Si `docker stats` se pega al techo de RAM de forma
    # sostenida, el siguiente paso es recortar `default_config:` (quitar
    # radio_browser/go2rtc/stream, discovery) en configuration.yaml —
    # ver CONTEXTO.md.
    mem_limit: 768m
    memswap_limit: 1024m
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Mexico_City
